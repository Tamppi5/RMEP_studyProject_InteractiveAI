version: '3.8'

services:
  backend:
    build:
      context: ./interface-backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      # Mount config file (read-only)
      - ./study.config.yml:/study.config.yml:ro
      # Mount customizations for hot-reload
      - ./customizations/correct_answers.py:/app/correct_answers.py
      # Mount data file for persistence (must exist on host)
      - ./study_data.json:/app/study_data.json
      # Mount source code for hot-reload (development)
      - ./interface-backend:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
    networks:
      - ai-study-network

  frontend:
    build:
      context: ./interface-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Mount config file (read-only)
      - ./study.config.yml:/study.config.yml:ro
      # Mount task files into public directory for hot-reload
      - ./customizations/tasks:/app/public:ro
      # Mount source code for hot-reload (development)
      - ./interface-frontend/src:/app/src
      - ./interface-frontend/vite.config.js:/app/vite.config.js
      # Exclude node_modules from volume mount (use container's version)
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ai-study-network

networks:
  ai-study-network:
    driver: bridge
